<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#131722"/>
<script>(function(){try{var u=new URL(location.href),k=u.searchParams.get('k');if(k){localStorage.setItem('nl_k',k)}else if(u.searchParams.get('nokey')!=='1'){var s=localStorage.getItem('nl_k');if(s&&/^[0-9a-f]{16,64}$/.test(s)){u.searchParams.set('k',s);history.replaceState(null,'',u.toString())}}}catch(e){}})()</script>
<title>Iceberg · paper</title>
<link rel="stylesheet" href="app.css?v=3"/>
<link rel="stylesheet" href="iceberg-page.css?v=1"/>
</head>
<body class="icePage">
<div id="app">
 <div class="tvbar">
  <a href="./?tab=iceberg" id="backDash">← Dashboard</a>
  <span class="ttl">ICEBERG · <span id="varName">BASE</span></span>
  <span class="srcb warn" id="srcBadge">● GitHub data load ho raha hai…</span>
 </div>
 <div id="icePage">
  <div class="m" id="varDesc">PAPER ONLY · not A/A+ · not advice</div>
  <div class="icePageStats" id="stats"></div>
  <div class="icePageChart">
   <div class="lbl"><span id="chartTitle">ICEBERG · 5m</span>
    <select id="symSel" aria-label="Symbol"></select>
    <a class="b" id="openChart" href="#">Open chart</a>
   </div>
   <div id="iceChart"></div>
  </div>
  <section class="icePageSec">
   <h2>WATCH · armed / awaiting trigger</h2>
   <div id="watch"></div>
  </section>
  <section class="icePageSec">
   <h2>LIVE / TRADED · entered (status only, no open P&amp;L)</h2>
   <div id="live"></div>
  </section>
  <section class="icePageSec">
   <h2>CLOSED TODAY · booked P&amp;L</h2>
   <div id="closed"></div>
  </section>
  <div class="foot"><span>GitHub data ~30s · IST · paper/demo only</span></div>
 </div>
</div>
<script src="nl-data.js?v=4"></script>
<script src="lightweight-charts.standalone.production.js"></script>
<script src="iceberg-page.js?v=2"></script>
</body></html>
